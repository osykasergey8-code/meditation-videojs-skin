<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meditation Video.js Skin</title>
  <link rel="stylesheet" href="app.css">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4efe4; color: #2f3a33; font-family: Georgia, serif; padding: 16px; box-sizing: border-box; }
    main { width: min(960px, 100%); }
    h1 { font-weight: normal; font-size: 1.5rem; margin: 0 0 8px; }
    p { margin: 0 0 16px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Mindful Moments</h1>
    <p>A calm guided meditation, played with a custom Video.js v10 skin.</p>
    <video-player>
      <video-skin class="meditation-skin">
        <video src="breathing.mp4" playsinline preload="metadata"></video>
      </video-skin>
    </video-player>
  </main>
  <script src="app.js" type="module"></script>
</body>
</html>
